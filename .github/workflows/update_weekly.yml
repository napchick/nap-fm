name: Update Weekly Stats

permissions:
  contents: write

on:
  schedule:
    - cron: "30 20 * * 0"
  workflow_dispatch:

jobs:
  update-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync branch
        run: git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run weekly script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python get_weekly.py

      - name: Commit updated weekly_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add weekly_data.json
          git commit -m "Update weekly stats" || echo "No changes to commit"

          git push